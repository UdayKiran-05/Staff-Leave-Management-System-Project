<!DOCTYPE html>
<html>

<head>
    <title>Staff Leave Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
/* 🔥 Hover effect for all buttons */
.btn {
    transition: all 0.3s ease;
}

/* Hover animation */
.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* Optional: stronger colors on hover */
.btn-success:hover {
    background-color: #198754;
}

.btn-danger:hover {
    background-color: #bb2d3b;
}

.btn-primary:hover {
    background-color: #0b5ed7;
}

.btn-warning:hover {
    background-color: #ffca2c;
}
</style>

</head>

<body>

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Staff Leave Management System</span>

        <div>
            <span class="text-white me-3">
                Welcome {{ request.user.username }}
            </span>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-3">

        {% if request.path != '/' and request.path != '/login/' %}
        <a href="javascript:history.back()" class="btn btn-outline-dark mb-3">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        {% endif %}

    </div>
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

</body>

</html>
