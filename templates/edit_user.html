{% extends 'base.html' %}
{% block content %}

<div class="card p-4 shadow">

<h3>Edit User</h3>

<form method="POST">
    {% csrf_token %}

    <label>Username</label>
    <input type="text"
           name="username"
           value="{{ user.username }}"
           class="form-control mb-3">


    <button class="btn btn-success">
        Update User
    </button>

</form>

</div>

{% endblock %}
