<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') no-repeat center center/cover;
            height: 100vh;
            margin: 0;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
        }

        .caption {
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 30px;
            font-style: italic;
        }
        /* 🔥 ADD THIS HOVER EFFECT */
    .btn {
        transition: all 0.3s ease;
    }

    .btn:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    /* Optional color boost */
    .btn-primary:hover {
        background-color: #0b5ed7;
    }

    .btn-success:hover {
        background-color: #157347;
    }
    </style>
</head>

<body>

<div class="overlay">

    <h1>Staff Leave Management System</h1>

    <!-- 🔥 Caption -->
    <p class="caption">
        "Consistency is what transforms average into excellence."
    </p>

    <!-- Buttons -->
    <div>
        <a href="/login/" class="btn btn-primary m-2 px-4">Login</a>
        <a href="/register/" class="btn btn-success m-2 px-4">Register</a>
    </div>

</div>

</body>
</html>
