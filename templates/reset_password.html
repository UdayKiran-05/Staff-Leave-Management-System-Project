{% extends 'base.html' %}
{% block content %}

<div class="card p-4 shadow">

<h3>Reset Password</h3>

<form method="POST">

    {% csrf_token %}

    <label>New Password</label>

    <input type="password"
           name="password"
           class="form-control mb-3">

    <button class="btn btn-primary">
        Reset Password
    </button>

</form>

</div>

{% endblock %}
