{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Apply Leave</h3>

            <form method="POST">
                {% csrf_token %}

                <!-- Leave Type -->
                <label class="form-label">Leave Type</label>
                <select class="form-control mb-3" name="leave_type" required>
                    <option value="">Select Leave Type</option>
                    <option value="Sick Leave">Sick Leave</option>
                    <option value="Casual Leave">Casual Leave</option>
                    <option value="Emergency Leave">Emergency Leave</option>
                </select>

                <!-- Start Date -->
                <label class="form-label">Start Date</label>
                <input class="form-control mb-3" type="date" name="start_date" min="{{ today }}" required>

                <!-- End Date -->
                <label class="form-label">End Date</label>
                <input class="form-control mb-3" type="date" name="end_date" min="{{ today }}" required>

                <!-- Reason -->
                <label class="form-label">Reason</label>
                <textarea class="form-control mb-3" name="reason" placeholder="Enter reason for leave"
                    required></textarea>

                <button class="btn btn-success w-100">
                    Submit Leave
                </button>

            </form>
        </div>

    </div>
</div>

{% endblock %}
